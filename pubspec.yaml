name: nearkart
description: "NearKart - Hyperlocal vendor marketplace for Indian market"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3
  firebase_messaging: ^16.4.1
  firebase_analytics: ^12.4.3

  # Navigation
  go_router: ^14.8.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  badges: ^3.1.2
  smooth_page_indicator: ^1.2.0+3
  lottie: ^3.5.1
  flutter_animate: ^4.5.2

  # Payments are UPI deep links opened with url_launcher, so no gateway SDK.

  # Location
  geolocator: ^13.0.2
  geocoding: ^5.0.0

  # Image
  image_picker: ^1.1.2
  image_cropper: ^12.2.1

  # Storage & Security
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^10.3.1

  # Network
  connectivity_plus: ^7.2.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  logger: ^2.7.0
  flutter_local_notifications: ^22.0.1
  qr_flutter: ^4.1.0
  google_sign_in: ^7.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
